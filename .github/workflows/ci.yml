name: Atlas CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-acceptance:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: true
      ATLAS_BOUNDARY_REPO: ${{ github.workspace }}/organism/boundary
      ATLAS_RDE_REPO: ${{ github.workspace }}/organism/recursive-discovery-engine
      D2_HARNESS: ${{ github.workspace }}/organism/director2-harness
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Boundary verifier
        uses: actions/checkout@v4
        with:
          repository: NexumCorpus/boundary
          ref: c2b925eec081b5b70affa3bbb19fb00cfd7dffb0
          path: organism/boundary
          persist-credentials: false
      - name: Checkout RDE verifier
        uses: actions/checkout@v4
        with:
          repository: NexumCorpus/recursive-discovery-engine
          ref: 8b317fd123d63d8349ec77a4f705eff3f226e3b2
          path: organism/recursive-discovery-engine
          persist-credentials: false
      - name: Checkout Director2 harness
        uses: actions/checkout@v4
        with:
          repository: NexumCorpus/director2
          ref: f5bd0cb8c474d4a7ade2a2f295f4520329cad892
          path: organism/director2-harness
          persist-credentials: false
      - name: Mount organism topology
        shell: pwsh
        run: |
          subst E: "$env:GITHUB_WORKSPACE\organism"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $required = @(
            'E:\boundary\tools\verify_xenosoma_receipt.py',
            'E:\recursive-discovery-engine\scripts\verify_xenosoma_receipt.py'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing independent verifier: $path"
            }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: organism/director2-harness/pyproject.toml
      - name: Install locked dependencies
        run: npm ci
      - name: Install Director2 harness
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -e "$env:D2_HARNESS"
      - name: Run complete organism acceptance
        shell: pwsh
        run: |
          npm run test:full *>&1 | Tee-Object -FilePath test-full.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $tail = (Get-Content -LiteralPath test-full.log -Tail 80) -join "`n"
            $escaped = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Host "::error title=Full acceptance failed::$escaped"
            exit $testExit
          }
